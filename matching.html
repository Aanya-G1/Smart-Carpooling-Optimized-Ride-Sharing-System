<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ride Matching</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(0,0,50,0.85);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    h2 {
      margin-bottom: 1.5rem;
    }
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .driver-btn {
      background: #22c55e;
      color: white;
    }
    .driver-btn:hover {
      background: #16a34a;
    }
    .passenger-btn {
      background: #f97316;
      color: white;
    }
    .passenger-btn:hover {
      background: #ea580c;
    }
    .back-btn {
      background: #444;
      margin-top: 1.5rem;
      color: white;
    }
    .back-btn:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔗 Ride Matching</h2>
    <button class="driver-btn" onclick="window.location.href='publishride.html'">🚗 Publish Ride (Driver)</button>
    <button class="passenger-btn" onclick="window.location.href='requestride.html'">🧍 Request Ride (Passenger)</button>
    <button class="back-btn" onclick="window.location.href='user.html'">⬅ Back</button>
  </div>
</body>
</html>
